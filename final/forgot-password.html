<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>
    <link rel="stylesheet" href="forgot-password.css">
</head>
<body>
    <main class="forgot-card">
        <nav class="card-nav" aria-label="Account navigation">
            <a class="back-button" href="index.html" aria-label="Back to login">
                <span aria-hidden="true">&#8592;</span>
            </a>
        </nav>

        <section class="forgot-content" aria-labelledby="forgot-title">
            <h1 id="forgot-title">Forgot password?</h1>
            <p class="subtitle">Don't worry about your account</p>

            <form id="forgot-form" novalidate>
                <div class="code-group" id="code-group" role="group" aria-label="Six digit verification code">
                    <input class="code-input" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="1" aria-label="Digit 1">
                    <input class="code-input" type="text" inputmode="numeric" maxlength="1" aria-label="Digit 2">
                    <input class="code-input" type="text" inputmode="numeric" maxlength="1" aria-label="Digit 3">
                    <input class="code-input" type="text" inputmode="numeric" maxlength="1" aria-label="Digit 4">
                    <input class="code-input" type="text" inputmode="numeric" maxlength="1" aria-label="Digit 5">
                    <input class="code-input" type="text" inputmode="numeric" maxlength="1" aria-label="Digit 6">
                </div>

                <button id="send-code" class="button button-send" type="button">Send code</button>
                <p id="code-status" class="code-status" role="status" aria-live="polite"></p>

                <button id="verify-code" class="button button-verify" type="submit">Verify code</button>
                <button id="resend-code" class="button button-resend" type="button">Resend code</button>
            </form>
        </section>
    </main>

    <script src="account-store.js"></script>
    <script src="forgot-password.js"></script>
</body>
</html>
