<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#e28af0">
    <title>MidLink Settings</title>
    <link rel="stylesheet" href="burger.css">
</head>
<body>
    <main class="settings-menu">
        <div class="profile">
            <img class="profile-picture" src="../anya.webp" alt="Anya Forger profile picture">
            <span class="profile-name">Anya Forger</span>
        </div>

        <section class="settings-navigation" aria-labelledby="settings-title">
            <div class="settings-heading">
                <svg class="settings-icon" viewBox="0 0 48 48" aria-hidden="true">
                    <path d="M20 3h8l1.5 6.1c1.3.4 2.5 1.1 3.6 2.1l6-1.6 4 7-4.5 4.4c.2 1.4.2 2.8 0 4.2l4.5 4.4-4 7-6-1.6a15 15 0 0 1-3.6 2.1L28 43h-8l-1.5-6.1a15 15 0 0 1-3.6-2.1l-6 1.6-4-7 4.5-4.4a15 15 0 0 1 0-4.2L4.9 16.4l4-7 6 1.6a15 15 0 0 1 3.6-2.1L20 3Z"/>
                    <circle cx="24" cy="23" r="7"/>
                </svg>
                <h1 id="settings-title">Setting</h1>
            </div>

            <nav class="settings-links" aria-label="Settings">
                <button class="settings-link" type="button" data-setting="account">
                    <span class="settings-arrow" aria-hidden="true">↪</span>
                    <span>Account info</span>
                </button>
                <button class="settings-link" type="button" data-setting="profilePhoto">
                    <span class="settings-arrow" aria-hidden="true">↪</span>
                    <span>Profile photo</span>
                </button>
                <button class="settings-link" type="button" data-setting="security">
                    <span class="settings-arrow" aria-hidden="true">↪</span>
                    <span>Password and Security</span>
                </button>
                <button class="settings-link" type="button" data-setting="family">
                    <span class="settings-arrow" aria-hidden="true">↪</span>
                    <span>Family Center</span>
                </button>
                <button class="settings-link" type="button" data-setting="notifications">
                    <span class="settings-arrow" aria-hidden="true">↪</span>
                    <span>Notifications</span>
                </button>
                <button class="settings-link" type="button" data-setting="appearance">
                    <span class="settings-arrow" aria-hidden="true">↪</span>
                    <span>Appearance</span>
                </button>
                <button class="settings-link" type="button" data-setting="language">
                    <span class="settings-arrow" aria-hidden="true">↪</span>
                    <span>Language</span>
                </button>
                <button class="settings-link" type="button" data-setting="help">
                    <span class="settings-arrow" aria-hidden="true">↪</span>
                    <span>Help and Support</span>
                </button>
            </nav>
        </section>

        <a class="logout-button" href="../index.html">Log Out</a>
    </main>

    <dialog class="settings-dialog" id="settings-dialog" aria-labelledby="dialog-title">
        <form method="dialog">
            <button class="dialog-close" type="submit" aria-label="Close settings">×</button>
        </form>
        <h2 id="dialog-title"></h2>
        <p id="dialog-description"></p>
        <div class="settings-details" id="settings-details" aria-live="polite"></div>
    </dialog>

    <script src="account-store.js"></script>
    <script src="burger.js"></script>
</body>
</html>
