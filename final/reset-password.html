<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password</title>
    <link rel="stylesheet" href="reset-password.css">
</head>
<body>
    <main class="reset-card">
        <nav class="card-nav" aria-label="Account navigation">
            <a class="back-button" href="forgot-password.html" aria-label="Back to verification">
                <span aria-hidden="true">&#8592;</span>
            </a>
            <a class="home-button" href="index.html" aria-label="Back to login">
                <span aria-hidden="true"></span>
            </a>
        </nav>

        <section class="reset-content" aria-labelledby="reset-title">
            <h1 id="reset-title">Reset password</h1>
            <p class="subtitle">Create new password</p>

            <form id="reset-form" novalidate>
                <div class="field-group">
                    <label for="new-password">New password</label>
                    <div class="password-wrap">
                        <input type="password" id="new-password" name="new-password" minlength="8" maxlength="64" autocomplete="new-password" aria-describedby="new-password-error" required>
                        <button class="password-toggle" type="button" aria-label="Show new password" aria-pressed="false"></button>
                    </div>
                    <p id="new-password-error" class="message" role="alert" hidden></p>
                </div>

                <div class="field-group">
                    <label for="confirm-password">Confirm new password</label>
                    <div class="password-wrap">
                        <input type="password" id="confirm-password" name="confirm-password" minlength="8" maxlength="64" autocomplete="new-password" aria-describedby="confirm-password-error" required>
                        <button class="password-toggle" type="button" aria-label="Show confirm password" aria-pressed="false"></button>
                    </div>
                    <p id="confirm-password-error" class="message" role="alert" hidden></p>
                </div>

                <label class="remember-option">
                    <input type="checkbox" id="remember-password" checked>
                    <span>Remember password</span>
                </label>

                <button class="save-button" type="submit">Save</button>
            </form>
        </section>
    </main>

    <script src="account-store.js"></script>
    <script src="reset-password.js"></script>
</body>
</html>
